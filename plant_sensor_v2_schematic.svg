<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .w { stroke:#222; stroke-width:2; fill:none }
    .pwrp { stroke:#c0392b; stroke-width:2.2; fill:none }
    .pwrn { stroke:#2c4fbf; stroke-width:2.2; fill:none }
    .sig { stroke:#1e8449; stroke-width:2.4; fill:none }
    .ref { stroke:#d35400; stroke-width:2.2; fill:none }
    .el { stroke:#7f8c8d; stroke-width:2.4; fill:none }
    .t { font-size:12px; fill:#222 }
    .s { font-size:10.5px; fill:#444 }
    .b { font-size:13px; font-weight:bold; fill:#222 }
    .pin { font-size:11px; font-family:Menlo, monospace; fill:#fff }
    .new { fill:#fff4d6; stroke:#e0a800; stroke-width:1.5 }
  </style>
  <defs>
    <g id="gnd"><path d="M0 0 V8 M-9 8 H9 M-6 12 H6 M-3 16 H3" stroke="#222" stroke-width="1.8" fill="none"/></g>
    <g id="resH"><path d="M0 0 h8 l4 -7 l8 14 l8 -14 l8 14 l8 -14 l8 14 l4 -7 h4" stroke="#222" stroke-width="1.8" fill="none"/></g>
    <g id="resV"><path d="M0 0 v8 l-7 4 l14 8 l-14 8 l14 8 l-14 8 l14 8 l-7 4 v4" stroke="#222" stroke-width="1.8" fill="none"/></g>
    <g id="capV"><path d="M0 0 V10 M-10 10 H10 M-10 16 H10 M0 16 V26" stroke="#222" stroke-width="1.8" fill="none"/></g>
  </defs>

  <rect width="1000" height="740" fill="#fbfbf8"/>
  <text x="500" y="30" text-anchor="middle" style="font-size:19px;font-weight:bold;fill:#222">Plant ephys front end, v2 (corrected, 3-electrode)</text>
  <text x="500" y="50" text-anchor="middle" class="s">INA128 (G = 6) → ADS1115 differential (A0 − A1) → Arduino Uno R4 · yellow boxes = changes from v1</text>

  <!-- Batteries -->
  <rect x="40" y="70" width="230" height="110" rx="6" fill="#fff" stroke="#999"/>
  <text x="155" y="90" text-anchor="middle" class="b">±9 V supply (2 × 9 V)</text>
  <rect x="60" y="102" width="56" height="22" fill="#fde2e2" stroke="#c0392b"/><text x="88" y="117" text-anchor="middle" class="t">9 V</text>
  <rect x="60" y="142" width="56" height="22" fill="#e2e8fd" stroke="#2c4fbf"/><text x="88" y="157" text-anchor="middle" class="t">9 V</text>
  <text x="52" y="117" text-anchor="end" class="t">+</text><text x="124" y="117" class="t">−</text>
  <text x="52" y="157" text-anchor="end" class="t">+</text><text x="124" y="157" class="t">−</text>
  <text x="140" y="117" class="s">A(+) → +9 V rail</text>
  <text x="140" y="133" class="s" style="fill:#1e8449;font-weight:bold">A(−) + B(+) → GND</text>
  <text x="140" y="157" class="s">B(−) → −9 V rail</text>
  <text x="140" y="173" class="s">GND = Arduino GND</text>

  <!-- INA128 -->
  <rect x="380" y="200" width="160" height="210" rx="6" fill="#2b2b2b"/>
  <circle cx="396" cy="214" r="5" fill="#666"/>
  <text x="460" y="300" text-anchor="middle" style="font-size:16px;font-weight:bold;fill:#fff">INA128P</text>
  <text x="460" y="318" text-anchor="middle" style="font-size:10px;fill:#bbb">G = 1 + 50k/Rg = 6</text>
  <g>
    <path class="w" d="M380 230 H360 M380 280 H360 M380 330 H360 M380 380 H360 M540 230 H560 M540 280 H560 M540 330 H560 M540 380 H560"/>
    <text x="388" y="234" class="pin">1 Rg</text><text x="388" y="284" class="pin">2 −IN</text>
    <text x="388" y="334" class="pin">3 +IN</text><text x="388" y="384" class="pin">4 V−</text>
    <text x="532" y="234" class="pin" text-anchor="end">Rg 8</text><text x="532" y="284" class="pin" text-anchor="end">V+ 7</text>
    <text x="532" y="334" class="pin" text-anchor="end">Vout 6</text><text x="532" y="384" class="pin" text-anchor="end">REF 5</text>
  </g>

  <!-- Rg -->
  <path class="w" d="M360 230 V160 H425 M485 160 H580 V230 H560"/>
  <use href="#resH" x="425" y="160"/>
  <text x="455" y="148" text-anchor="middle" class="t">Rg 10 kΩ (pins 1–8)</text>

  <!-- V+ and C1 -->
  <path class="pwrp" d="M560 280 H640 V100"/>
  <text x="648" y="104" class="t" style="fill:#c0392b;font-weight:bold">+9 V</text>
  <path class="pwrp" d="M640 190 H690"/>
  <use href="#capV" x="690" y="190"/><use href="#gnd" x="690" y="216"/>
  <text x="704" y="208" class="s">C1 0.1 µF (at pin 7)</text>

  <!-- V- and C2 -->
  <path class="pwrn" d="M360 380 H300 V480"/>
  <text x="300" y="497" text-anchor="middle" class="t" style="fill:#2c4fbf;font-weight:bold">−9 V</text>
  <path class="pwrn" d="M300 430 H255"/>
  <use href="#capV" x="255" y="430"/><use href="#gnd" x="255" y="456"/>
  <text x="248" y="482" text-anchor="end" class="s">C2 0.1 µF (at pin 4)</text>

  <!-- Plant / sponge and electrodes -->
  <rect x="50" y="230" width="150" height="190" rx="18" fill="#eef7e4" stroke="#6a9f3b" stroke-width="2"/>
  <text x="125" y="252" text-anchor="middle" class="b">Plant / sponge</text>
  <circle cx="190" cy="280" r="6" fill="#c0c0c0" stroke="#555"/>
  <circle cx="190" cy="330" r="6" fill="#c0c0c0" stroke="#555"/>
  <circle cx="125" cy="410" r="6" fill="#c0c0c0" stroke="#555"/>
  <text x="180" y="276" text-anchor="end" class="s">Reference electrode</text>
  <text x="180" y="326" text-anchor="end" class="s">Recording electrode</text>
  <text x="125" y="398" text-anchor="middle" class="s">Ground electrode</text>
  <path class="el" d="M196 280 H360"/>
  <path class="el" d="M196 330 H360"/>
  <text x="275" y="274" text-anchor="middle" class="s">→ pin 2 (−IN)</text>
  <text x="275" y="324" text-anchor="middle" class="s">→ pin 3 (+IN)</text>
  <path class="el" d="M125 416 V520"/><use href="#gnd" x="125" y="520"/>
  <rect x="140" y="470" width="120" height="40" rx="4" class="new"/>
  <text x="200" y="486" text-anchor="middle" class="s">NEW: 3rd electrode</text>
  <text x="200" y="500" text-anchor="middle" class="s">→ circuit GND</text>

  <!-- REF divider (unbuffered; differential readout cancels it) -->
  <path class="ref" d="M560 380 H600"/>
  <circle cx="600" cy="380" r="3.5" fill="#d35400"/>
  <path class="w" d="M600 380 H620"/><use href="#resH" x="620" y="380"/>
  <path class="pwrp" d="M680 380 H700"/>
  <text x="704" y="384" class="t" style="fill:#c0392b">+5 V (Arduino)</text>
  <text x="650" y="370" text-anchor="middle" class="s">R1 10k</text>
  <path class="w" d="M600 380 V400"/><use href="#resV" x="600" y="400"/>
  <path class="w" d="M600 460 V470"/><use href="#gnd" x="600" y="470"/>
  <text x="612" y="432" class="s">R2 10k</text>
  <path class="w" d="M600 392 H650"/><use href="#capV" x="650" y="392"/>
  <path class="w" d="M650 418 V470"/><use href="#gnd" x="650" y="470"/>
  <text x="662" y="412" class="s">C3 100 nF</text>

  <!-- Vout -> 10k -> A0, 100n -->
  <path class="sig" d="M560 330 H620"/><use href="#resH" x="620" y="330"/>
  <path class="sig" d="M680 330 H820"/>
  <text x="650" y="318" text-anchor="middle" class="s">R3 10k</text>
  <circle cx="770" cy="330" r="3.5" fill="#1e8449"/>
  <use href="#capV" x="770" y="330"/><use href="#gnd" x="770" y="356"/>
  <text x="760" y="352" text-anchor="end" class="s">C4 100n</text>
  <rect x="604" y="285" width="196" height="24" rx="4" class="new"/>
  <text x="702" y="301" text-anchor="middle" class="s">NEW: protects ADS1115 when amp saturates</text>

  <!-- REF -> 10k -> A1, 100n -->
  <path class="ref" d="M580 380 V560 H620"/><circle cx="580" cy="380" r="3.5" fill="#d35400"/>
  <use href="#resH" x="620" y="560"/>
  <path class="ref" d="M680 560 H790 V370 H820"/>
  <text x="650" y="548" text-anchor="middle" class="s">R4 10k</text>
  <circle cx="740" cy="560" r="3.5" fill="#d35400"/>
  <use href="#capV" x="740" y="560"/><use href="#gnd" x="740" y="586"/>
  <text x="752" y="582" class="s">C5 100n</text>
  <rect x="600" y="610" width="230" height="38" rx="4" class="new"/>
  <text x="715" y="626" text-anchor="middle" class="s">NEW: REF also to A1 (matched 10k/100n);</text>
  <text x="715" y="640" text-anchor="middle" class="s">firmware reads A0 − A1 differentially</text>

  <!-- ADS1115 -->
  <rect x="820" y="300" width="130" height="190" rx="6" fill="#1f3fbf"/>
  <text x="885" y="420" text-anchor="middle" style="font-size:14px;font-weight:bold;fill:#fff">ADS1115</text>
  <text x="885" y="438" text-anchor="middle" style="font-size:10px;fill:#ccd">GAIN_TWO, 8 SPS</text>
  <text x="830" y="334" class="pin">A0</text><text x="830" y="374" class="pin">A1</text>
  <text x="830" y="470" class="pin">ADDR→GND</text>
  <text x="940" y="334" class="pin" text-anchor="end">VDD→5V</text>
  <text x="940" y="354" class="pin" text-anchor="end">GND→GND</text>
  <text x="940" y="374" class="pin" text-anchor="end">SDA→A4</text>
  <text x="940" y="394" class="pin" text-anchor="end">SCL→A5</text>

  <!-- Notes -->
  <rect x="40" y="560" width="520" height="165" rx="6" fill="#fff" stroke="#999"/>
  <text x="54" y="582" class="b">Build notes</text>
  <text x="54" y="602" class="s">• All grounds meet at one point: battery centre tap, Arduino GND, ADS1115 GND/ADDR, C1–C5, R2, GND electrode.</text>
  <text x="54" y="620" class="s">• C1/C2 within ~1 cm of pins 7 and 4. Electrode leads short, twisted, foil-wrapped (foil to GND at circuit end).</text>
  <text x="54" y="638" class="s">• REF needs no op-amp buffer here: A1 measures the actual REF pin, so REF movement cancels (verified in SPICE).</text>
  <text x="54" y="656" class="s">• Range at electrodes ±341 mV, 10.4 µV/LSB. Sponge test: all 3 wires in the sponge, ~2 cm apart.</text>
  <text x="54" y="674" class="s">• 2-electrode fallback: tie pin 2 to GND (works, but simulated 60 Hz pickup ~12 mV vs ~4 µV).</text>
  <text x="54" y="692" class="s">• Run laptop on battery while recording to avoid ground loops through USB.</text>
  <text x="54" y="712" class="s">• Parts beyond v1: 2 × 10k, 2 × 100 nF (C4, C5), C3 100 nF, one more silver-wire electrode.</text>
</svg>
